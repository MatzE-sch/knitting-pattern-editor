<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Strickmuster-Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --cell-size: 18px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f0f0;
    }

    #app {
      display: flex;
      height: 100%;
      min-height: 0;
    }

    /* ── Sidebar ─────────────────────────────────────── */
    #sidebar {
      width: 160px;
      min-width: 160px;
      background: #2c2c2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    #sidebar h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8e8e93;
      margin-bottom: -8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-row label {
      font-size: 12px;
      color: #aeaeb2;
    }

    .input-row input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: #3a3a3c;
      color: #fff;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }

    .input-row input[type="number"]:focus {
      background: #48484a;
      box-shadow: 0 0 0 2px #0a84ff;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
      user-select: none;
    }

    .btn:active {
      opacity: 0.75;
      transform: scale(0.97);
    }

    .btn-primary  { background: #0a84ff; color: #fff; }
    .btn-secondary { background: #3a3a3c; color: #fff; }
    .btn-danger   { background: #ff453a; color: #fff; }
    .btn-success  { background: #30d158; color: #fff; }

    /* ── Zoom row ────────────────────────────────────── */
    .zoom-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zoom-row .zoom-btn {
      flex: 0 0 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: #3a3a3c;
      color: #fff;
      font-size: 22px;
      font-weight: 300;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .zoom-row .zoom-btn:active { opacity: 0.7; }
    .zoom-row .zoom-btn:disabled { opacity: 0.3; }

    .zoom-row .zoom-label {
      flex: 1;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    /* ── Color Buttons ──────────────────────────────── */
    .color-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .color-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      background: #3a3a3c;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .color-btn:active { opacity: 0.8; }

    .color-btn.active {
      border-color: #0a84ff;
      background: #1c3a5e;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .color-swatch.black { background: #000; }
    .color-swatch.gray  { background: #808080; }
    .color-swatch.white { background: #fff; border: 1px solid #555; }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      background: #3a3a3c;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .tool-btn.active {
      border-color: #ff9f0a;
      background: #3d2e00;
    }

    .tool-btn:active { opacity: 0.8; }

    .tool-icon {
      font-size: 20px;
      width: 28px;
      text-align: center;
    }

    /* ── Main area ──────────────────────────────────── */
    #canvas-area {
      flex: 1;
      overflow: auto;
      background: #e5e5ea;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      min-height: 0;
    }

    #grid-placeholder {
      color: #8e8e93;
      font-size: 16px;
      text-align: center;
      margin: auto;
      line-height: 1.6;
    }

    /* ── Grid ────────────────────────────────────────── */
    #grid-wrapper {
      display: inline-grid;
      border: 1px solid #999;
      gap: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
    }

    .num-cell {
      background: #d1d1d6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--cell-size) * 0.55);
      color: #555;
      font-weight: 500;
      width: var(--cell-size);
      height: var(--cell-size);
      pointer-events: none;
      border-right: 1px solid #bbb;
      border-bottom: 1px solid #bbb;
      overflow: hidden;
    }

    .draw-cell {
      background: #fff;
      width: var(--cell-size);
      height: var(--cell-size);
      cursor: crosshair;
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
    }

  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h2>Raster</h2>
    <div class="control-group">
      <div class="input-row">
        <label>Breite (Spalten)</label>
        <input type="number" id="input-cols" min="1" max="500" value="10" inputmode="numeric">
      </div>
      <div class="input-row">
        <label>Höhe (Zeilen)</label>
        <input type="number" id="input-rows" min="1" max="500" value="10" inputmode="numeric">
      </div>
      <button class="btn btn-primary" id="btn-create">Raster erstellen</button>
    </div>

    <h2>Zoom</h2>
    <div class="zoom-row">
      <button class="zoom-btn" id="btn-zoom-out">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="zoom-btn" id="btn-zoom-in">+</button>
    </div>

    <h2>Farbe</h2>
    <div class="color-buttons">
      <div class="color-btn active" id="btn-black">
        <span class="color-swatch black"></span>
        <span>Schwarz</span>
      </div>
      <div class="color-btn" id="btn-gray">
        <span class="color-swatch gray"></span>
        <span>Grau</span>
      </div>
      <div class="color-btn" id="btn-white">
        <span class="color-swatch white"></span>
        <span>Weiß</span>
      </div>
    </div>

    <h2>Werkzeuge</h2>
    <div class="control-group">
      <div class="tool-btn" id="btn-scroll">
        <span class="tool-icon">🖐</span>
        <span>Scrollen</span>
      </div>
      <div class="tool-btn" id="btn-eraser">
        <span class="tool-icon">⬜</span>
        <span>Radierer</span>
      </div>
    </div>

    <h2>Aktionen</h2>
    <div class="control-group">
      <button class="btn btn-secondary" id="btn-undo">↩ Rückgängig</button>
      <button class="btn btn-danger" id="btn-clear">✕ Alles löschen</button>
      <button class="btn btn-success" id="btn-export">⬇ Als PDF</button>
    </div>
  </aside>

  <main id="canvas-area">
    <div id="grid-placeholder">
      Gib Breite und Höhe ein<br>und tippe auf <strong>Raster erstellen</strong>
    </div>
    <div id="grid-wrapper" style="display:none;"></div>
  </main>
</div>

<script>
  // ── State ──────────────────────────────────────────
  let numCols = 0;
  let numRows = 0;
  let cellColors = [];
  let history = [];
  let isPainting = false;
  let sessionSnapshot = null;
  let currentTool = 'color';
  let currentColor = '#000000';
  let lastPaintedIdx = -1;

  // 25% steps from 25% to 200% (base = 18px at 100%)
  const ZOOM_STEPS = [5, 9, 14, 18, 23, 27, 32, 36];
  const ZOOM_LABELS = ['25%','50%','75%','100%','125%','150%','175%','200%'];
  let zoomIdx = 3; // default 100%

  // ── DOM refs ───────────────────────────────────────
  const gridWrapper  = document.getElementById('grid-wrapper');
  const placeholder  = document.getElementById('grid-placeholder');
  const btnCreate    = document.getElementById('btn-create');
  const inputCols    = document.getElementById('input-cols');
  const inputRows    = document.getElementById('input-rows');
  const btnBlack     = document.getElementById('btn-black');
  const btnGray      = document.getElementById('btn-gray');
  const btnWhite     = document.getElementById('btn-white');
  const btnScroll    = document.getElementById('btn-scroll');
  const btnEraser    = document.getElementById('btn-eraser');
  const btnUndo      = document.getElementById('btn-undo');
  const btnClear     = document.getElementById('btn-clear');
  const btnExport    = document.getElementById('btn-export');
  const btnZoomIn    = document.getElementById('btn-zoom-in');
  const btnZoomOut   = document.getElementById('btn-zoom-out');
  const zoomLabel    = document.getElementById('zoom-label');
  const canvasArea   = document.getElementById('canvas-area');

  // ── Zoom ───────────────────────────────────────────
  function applyZoom() {
    const size = ZOOM_STEPS[zoomIdx];
    document.documentElement.style.setProperty('--cell-size', size + 'px');
    zoomLabel.textContent = ZOOM_LABELS[zoomIdx];
    btnZoomOut.disabled = zoomIdx === 0;
    btnZoomIn.disabled  = zoomIdx === ZOOM_STEPS.length - 1;
    // update grid columns if grid exists
    if (numCols > 0) {
      gridWrapper.style.gridTemplateColumns = `var(--cell-size) repeat(${numCols}, var(--cell-size))`;
    }
  }

  btnZoomIn.addEventListener('click', () => {
    if (zoomIdx < ZOOM_STEPS.length - 1) { zoomIdx++; applyZoom(); }
  });
  btnZoomOut.addEventListener('click', () => {
    if (zoomIdx > 0) { zoomIdx--; applyZoom(); }
  });

  applyZoom();

  // ── Grid creation ──────────────────────────────────
  function createGrid(cols, rows) {
    numCols = cols;
    numRows = rows;
    cellColors = new Array(cols * rows).fill('');
    history = [];

    gridWrapper.style.gridTemplateColumns = `var(--cell-size) repeat(${cols}, var(--cell-size))`;
    gridWrapper.innerHTML = '';

    // Header row: corner + column numbers
    gridWrapper.appendChild(makeNumCell(''));
    for (let c = 1; c <= cols; c++) {
      gridWrapper.appendChild(makeNumCell(c));
    }

    // Data rows: row number + draw cells
    for (let r = 0; r < rows; r++) {
      gridWrapper.appendChild(makeNumCell(r + 1));
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        const cell = document.createElement('div');
        cell.className = 'draw-cell';
        cell.dataset.idx = idx;
        gridWrapper.appendChild(cell);
      }
    }

    placeholder.style.display = 'none';
    gridWrapper.style.display = 'inline-grid';
  }

  function makeNumCell(text) {
    const el = document.createElement('div');
    el.className = 'num-cell';
    el.textContent = text;
    return el;
  }

  // ── Paint logic ────────────────────────────────────
  function paintCell(cell) {
    const idx = parseInt(cell.dataset.idx, 10);
    if (isNaN(idx) || idx === lastPaintedIdx) return;
    lastPaintedIdx = idx;

    if (currentTool === 'eraser') {
      cellColors[idx] = '';
      cell.style.backgroundColor = '';
    } else {
      cellColors[idx] = currentColor;
      cell.style.backgroundColor = currentColor;
    }
  }

  function cellFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return (el && el.classList.contains('draw-cell')) ? el : null;
  }

  // ── Pointer events (grid only) ─────────────────────
  gridWrapper.addEventListener('pointerdown', e => {
    if (currentTool === 'scroll') return;
    e.preventDefault();
    isPainting = true;
    lastPaintedIdx = -1;
    sessionSnapshot = [...cellColors];
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (cell) paintCell(cell);
  });

  gridWrapper.addEventListener('pointermove', e => {
    if (!isPainting) return;
    e.preventDefault();
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (cell) paintCell(cell);
  });

  function stopPainting() {
    if (!isPainting) return;
    if (sessionSnapshot) {
      history.push(sessionSnapshot);
      if (history.length > 100) history.shift();
    }
    isPainting = false;
    sessionSnapshot = null;
    lastPaintedIdx = -1;
  }

  // Stop painting on window level so lifting finger anywhere works
  window.addEventListener('pointerup',     stopPainting);
  window.addEventListener('pointercancel', stopPainting);

  // ── Sidebar buttons ────────────────────────────────
  btnCreate.addEventListener('click', () => {
    const c = parseInt(inputCols.value, 10);
    const r = parseInt(inputRows.value, 10);
    if (!c || !r || c < 1 || r < 1) return;
    // blur inputs to dismiss keyboard before building grid
    inputCols.blur();
    inputRows.blur();
    createGrid(c, r);
  });

  [inputCols, inputRows].forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') btnCreate.click();
    });
  });

  function selectColorTool(color) {
    currentTool = 'color';
    currentColor = color;
    [btnBlack, btnGray, btnWhite].forEach(b => b.classList.remove('active'));
    if (color === '#000000') btnBlack.classList.add('active');
    else if (color === '#808080') btnGray.classList.add('active');
    else if (color === '#ffffff') btnWhite.classList.add('active');
    btnEraser.classList.remove('active');
    btnScroll.classList.remove('active');
    gridWrapper.style.touchAction = 'none';
  }

  btnBlack.addEventListener('click', () => selectColorTool('#000000'));
  btnGray.addEventListener('click',  () => selectColorTool('#808080'));
  btnWhite.addEventListener('click', () => selectColorTool('#ffffff'));

  btnScroll.addEventListener('click', () => {
    currentTool = 'scroll';
    [btnBlack, btnGray, btnWhite].forEach(b => b.classList.remove('active'));
    btnEraser.classList.remove('active');
    btnScroll.classList.add('active');
    gridWrapper.style.touchAction = 'pan-x pan-y';
  });

  btnEraser.addEventListener('click', () => {
    currentTool = 'eraser';
    [btnBlack, btnGray, btnWhite].forEach(b => b.classList.remove('active'));
    btnEraser.classList.add('active');
    btnScroll.classList.remove('active');
    gridWrapper.style.touchAction = 'none';
  });

  btnUndo.addEventListener('click', () => {
    if (history.length === 0) return;
    cellColors = history.pop();
    gridWrapper.querySelectorAll('.draw-cell').forEach(cell => {
      const idx = parseInt(cell.dataset.idx, 10);
      cell.style.backgroundColor = cellColors[idx] || '';
    });
  });

  btnClear.addEventListener('click', () => {
    if (numCols === 0) return;
    history.push([...cellColors]);
    if (history.length > 100) history.shift();
    cellColors.fill('');
    gridWrapper.querySelectorAll('.draw-cell').forEach(cell => {
      cell.style.backgroundColor = '';
    });
  });

  btnExport.addEventListener('click', () => {
    if (numCols === 0) return;
    const { jsPDF } = window.jspdf;

    const cellMm   = 5;      // mm per grid cell
    const labelMm  = 7;      // mm for number row/column
    const margin   = 10;
    const fontSize = 4;

    const gridW = labelMm + numCols * cellMm;
    const gridH = labelMm + numRows * cellMm;
    const pageW = gridW + margin * 2;
    const pageH = gridH + margin * 2;

    const doc = new jsPDF({
      orientation: pageW >= pageH ? 'landscape' : 'portrait',
      unit: 'mm',
      format: [pageW, pageH]
    });

    const ox = margin; // origin x
    const oy = margin; // origin y

    doc.setFontSize(fontSize);

    // Column numbers
    for (let c = 0; c < numCols; c++) {
      const x = ox + labelMm + c * cellMm + cellMm / 2;
      const y = oy + labelMm - 1;
      doc.text(String(c + 1), x, y, { align: 'center' });
    }

    // Row numbers + cells
    for (let r = 0; r < numRows; r++) {
      const cy = oy + labelMm + r * cellMm;

      // Row number
      doc.text(String(r + 1), ox + labelMm / 2, cy + cellMm / 2 + fontSize * 0.18, { align: 'center' });

      for (let c = 0; c < numCols; c++) {
        const cx = ox + labelMm + c * cellMm;
        const color = cellColors[r * numCols + c];

        if (color === '#000000') {
          doc.setFillColor(0, 0, 0);
          doc.rect(cx, cy, cellMm, cellMm, 'FD');
        } else if (color === '#808080') {
          doc.setFillColor(128, 128, 128);
          doc.rect(cx, cy, cellMm, cellMm, 'FD');
        } else {
          doc.setFillColor(255, 255, 255);
          doc.setDrawColor(200, 200, 200);
          doc.setLineWidth(0.1);
          doc.rect(cx, cy, cellMm, cellMm, 'FD');
        }
      }
    }

    doc.save('strickmuster.pdf');
  });
</script>
</body>
</html>
